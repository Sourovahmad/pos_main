version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_main_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - pos_main_network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: pos_main_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pos_main_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: pos_main_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pos_main
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pos_main_network

  redis:
    image: redis:alpine
    container_name: pos_main_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - pos_main_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: pos_main_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pos_main_network

networks:
  pos_main_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local

